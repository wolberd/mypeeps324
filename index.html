<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Persons Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Research Persons Tracker</h1>
            <button id="addPersonBtn" class="add-btn">+</button>
        </header>
        
        <main>
            <div id="personsList" class="persons-list">
                <!-- Persons will be added here dynamically -->
            </div>
        </main>
    </div>

    <!-- Modal for adding new person -->
    <div id="addPersonModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add New Person</h2>
            <form id="addPersonForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="role">Role/Title:</label>
                    <input type="text" id="role">
                </div>
                <div class="form-group">
                    <label for="notes">Notes:</label>
                    <textarea id="notes" rows="4"></textarea>
                </div>
                <button type="submit" class="submit-btn">Add Person</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDaTkbW0WWe4L9e-01g4HPlpk6Neh2s8P0",
            authDomain: "peopleapp-5143a.firebaseapp.com",
            projectId: "peopleapp-5143a",
            storageBucket: "peopleapp-5143a.firebasestorage.app",
            messagingSenderId: "49774629896",
            appId: "1:49774629896:web:ee3e89dba171cabc282dbd"
        };

        // Initialize Firebase and make it available globally
        const app = initializeApp(firebaseConfig);
        const firestoreDb = getFirestore(app);

        // Make Firebase functions and db available globally
        window.db = firestoreDb;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.doc = doc;

        // Load the main script after Firebase is initialized
        const script = document.createElement('script');
        script.type = 'module';
        script.src = 'script.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
